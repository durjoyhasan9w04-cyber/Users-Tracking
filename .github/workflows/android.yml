name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, master, rebuild/glassmorphic-v2 ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android-starter
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-hub-debug-apk
          path: native-android-starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30