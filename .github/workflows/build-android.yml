name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name user_hub .

      - name: Configure Android local notification permissions and receivers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('Android manifest not found after flutter create')
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          permissions = {node.get(android + 'name') for node in root.findall('uses-permission')}
          for name in ('android.permission.INTERNET', 'android.permission.POST_NOTIFICATIONS', 'android.permission.RECEIVE_BOOT_COMPLETED'):
              if name not in permissions:
                  permission = ET.Element('uses-permission')
                  permission.set(android + 'name', name)
                  application = root.find('application')
                  root.insert(list(root).index(application), permission)
          application = root.find('application')
          if application is None:
              raise SystemExit('Android application element not found')
          receiver_names = {node.get(android + 'name') for node in application.findall('receiver')}
          scheduled = 'com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver'
          if scheduled not in receiver_names:
              ET.SubElement(application, 'receiver', {
                  android + 'name': scheduled,
                  android + 'exported': 'false',
              })
          boot = 'com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver'
          if boot not in receiver_names:
              receiver = ET.SubElement(application, 'receiver', {
                  android + 'name': boot,
                  android + 'exported': 'false',
              })
              intent_filter = ET.SubElement(receiver, 'intent-filter')
              for action_name in (
                  'android.intent.action.BOOT_COMPLETED',
                  'android.intent.action.MY_PACKAGE_REPLACED',
                  'android.intent.action.QUICKBOOT_POWERON',
                  'com.htc.intent.action.QUICKBOOT_POWERON',
              ):
                  ET.SubElement(intent_filter, 'action', {android + 'name': action_name})
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          print('Configured Android notification permission and reboot receivers')
          PY

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = next(
              (p for p in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")) if p.exists()),
              None,
          )
          if gradle_file is None:
              raise SystemExit("Android app Gradle file not found")

          text = gradle_file.read_text()
          newline = chr(10)

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit("compileOptions block not found")
              setting = (
                  "        isCoreLibraryDesugaringEnabled = true"
                  if gradle_file.suffix == ".kts"
                  else "        coreLibraryDesugaringEnabled true"
              )
              text = text.replace(marker, marker + newline + setting, 1)

          if "desugar_jdk_libs" not in text:
              dependency = (
                  '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                  if gradle_file.suffix == ".kts"
                  else "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              )
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {" + newline + dependency, 1)
              else:
                  text += newline + "dependencies {" + newline + dependency + newline + "}" + newline

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              raise SystemExit("Could not enable core library desugaring")
          if "desugar_jdk_libs" not in text:
              raise SystemExit("Could not add desugar_jdk_libs dependency")

          gradle_file.write_text(text)
          print(f"Configured core library desugaring in {gradle_file}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Configure permanent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing)
                  + ". Add the four release-signing secrets in repository Settings."
              )

          android_dir = Path("android/app")
          keystore = android_dir / "user-hub-release.jks"
          keystore.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))

          gradle_file = next(
              (p for p in (android_dir / "build.gradle.kts", android_dir / "build.gradle") if p.exists()),
              None,
          )
          if gradle_file is None:
              raise SystemExit("Android app Gradle file not found")

          text = gradle_file.read_text()
          if gradle_file.suffix == ".kts":
              signing = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("user-hub-release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              '''
              text = text.replace("android {", "android {\n" + signing, 1)
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")'
              )
          else:
              signing = '''
              signingConfigs {
                  release {
                      storeFile file("user-hub-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              '''
              text = text.replace("android {", "android {\n" + signing, 1)
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )
          if "user-hub-release.jks" not in text or ('create("release")' not in text and "release {" not in text):
              raise SystemExit("Could not configure the release signing configuration")
          gradle_file.write_text(text)
          print("Configured permanent release signing")
          PY

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-hub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
