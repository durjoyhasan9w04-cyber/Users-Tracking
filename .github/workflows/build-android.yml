name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name user_hub .

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("Could not find android/app/build.gradle(.kts)")

          text = gradle_file.read_text()
          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              if gradle_file.suffix == ".kts":
                  text = text.replace(
                      "compileOptions {",
                      "compileOptions {\\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              else:
                  text = text.replace(
                      "compileOptions {",
                      "compileOptions {\\n        coreLibraryDesugaringEnabled true",
                      1,
                  )

          if "desugar_jdk_libs" not in text:
              if gradle_file.suffix == ".kts":
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
              else:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      1,
                  )

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              raise SystemExit("Failed to enable core library desugaring in Android Gradle config")
          if "desugar_jdk_libs" not in text:
              raise SystemExit("Failed to add desugar_jdk_libs dependency")

          gradle_file.write_text(text)
          print(f"Enabled core library desugaring in {gradle_file}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-hub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
