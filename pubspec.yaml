name: user_hub
description: A standalone user activity and relationship manager for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.3.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1
  fl_chart: ^1.1.1
  go_router: ^16.2.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  file_picker: ^10.3.2
  share_plus: ^11.1.0
  pdf: ^3.11.3
  uuid: ^4.5.1
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/management_logo.png

dependency_overrides:
  # pdf 3.12.x requires archive <4.1.0; image 4.10.2 remains compatible.
  image: 4.10.2
